<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            // INCLUDES = check if the element is inside an array or strings

            const nums = [1,2,3,4,5,7];
            
            console.log('FOR ARRAYS');
            
            console.log(nums.includes(3));
            console.log(nums.includes(6));

            console.log('FOR STRINGS');

            const str = 'Aswath';
            console.log(str.includes('A'));

    </script>
</body>
</html>
