<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
            // FETCH = Function used for making HTTP requests to fetch resources.
            //         (JSON styled datas, images, files) - resources
            //         used for interacting with APIs to retrieve and send data over the web
            //         fetch(url, {method: "methods" })
            //         GET - get some resources - This is default
            //         POST - send some datas
            //         PUT -  replace some datas
            //         DELETE - to delete some data

            //         FETCH - always return promises

            console.log(fetch('https://official-joke-api.appspot.com/jokes/programming/random')) // Prints as JSON document 

            fetch('https://official-joke-api.appspot.com/jokes/programming/random')
            .then((res) => console.log(res.json())) // prints the array value (resources)
            .then((msg) => console.log(msg[0].setup, msg[0].punchline)) // prints the msg
            .catch((err) => console.log(err));



    </script>
</body>
</html>
