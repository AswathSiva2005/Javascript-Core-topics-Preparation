            const title = [

                }
            ]

            const allTitle = title.map((titles) => {
                return titles.name;
            })

            title.forEach((titles) => {
                document.getElementById('title').innerHTML = titles.name;
            })

            // document.getElementById('title').innerHTML = allTitle;
    </script>
</body>
