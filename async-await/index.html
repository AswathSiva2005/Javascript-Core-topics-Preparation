<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            // ASYNC/AWAIT = Async -> make a function return a promise
            //               Await -> make a async function wait for a promise

            //               Allows to write asynchronous code in synchronous manner
            //               Async don't have resolve or reject parameters
            //               Everything after async is placed in an event queue

            function dog(){
                return new Promise((resolve,reject) => {
                    setTimeout(() => {
                        const isDog = true;
                        if(isDog){
                            resolve("🐕🦴");
                        }
                        else{
                            reject("No DOG !!");
                        }
                    }, 1500);
                })
            }

            function Kitchen(){
                return new Promise((resolve,reject) => {
                    setTimeout(() => {
                        const isKitchen = true;
                        if(isKitchen){
                            resolve("🍉🍔");
                        }
                        else{
                            reject("No Kitchen !!");
                        }
                    }, 3000)
                })
            }

            function trash(){
                return new Promise((resolve,reject) => {
                    setTimeout(() => {
                        const isTrash = false;
                        if(isTrash){
                            resolve("🗑️♻️");
                        }
                        else{
                            reject("No Trash !!");
                        }
                    },500)
                })
            }

            async function doWorks(){
                try{

                        //1. call dog
                        const dogResult = await dog();
                        console.log(dogResult);

                        //2. call kitchen
                        const kitchenResult = await Kitchen();
                        console.log(kitchenResult);

                        //3. call trash
                        const trashResult = await trash();
                        console.log(trashResult);
                        

                        //Final msg
                        console.log("All works completed ✅");
                }
                catch(error){
                        console.error("Failed");
                }
            }
            

            doWorks();
    </script>
</body>
</html>
