<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
            // PROMISE = It is an object that manages asynchronous operations.
            //           It wrap a Promise Object around {asynchronous code}.
            //           "It promise to return a value".
            //           PENDING -> RESOLVED(success) or REJECTED(failded).
            //           new promise (( resolve, reject) => {asynchronous code} )

            // 1. Walk the Dog
            // 2. Clean the Kitchen
            // 3. Take out the Trash


            function dog(){
                return new Promise((resolve,reject) => {
                    setTimeout(() => {
                        const isDog = true;
                        if(isDog){
                            resolve("🐕🦴");
                        }
                        else{
                            reject("No DOG !!");
                        }
                    }, 1500);
                })
            }

            function Kitchen(){
                return new Promise((resolve,reject) => {
                    setTimeout(() => {
                        const isKitchen = true;
                        if(isKitchen){
                            resolve("🍉🍔");
                        }
                        else{
                            reject("No Kitchen !!");
                        }
                    }, 3000)
                })
            }

            function trash(){
                return new Promise((resolve,reject) => {
                    setTimeout(() => {
                        const isTrash = false;
                        if(isTrash){
                            resolve("🗑️♻️");
                        }
                        else{
                            reject("No Trash !!");
                        }
                    },500)
                })
            }
          
            dog().then(value => {console.log(value); return Kitchen()})
                 .then(value => {console.log(value); return trash()})
                 .then(value => {console.log(value); console.log("All works completed ✅")})
                 .catch(error => console.log(error));
    </script>
</body>
</html>
