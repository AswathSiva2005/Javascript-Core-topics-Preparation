<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2 id="numResult"></h2>

    <h4 id="errorResult" style="background-color: aqua; color: black;"></h4>

    <script>
            // TRY =   give all possible error with condition(if) and throw error alert
            // CATCH = print the errors
            // FINALLY = If error or not error - but finally will run complusary

            try{
                num = prompt("Enter a number : "); // Enter only number no letters(NaN)

                // if empty space
                if(num === ''){
                    throw "Cannot be empty !!"
                }

                // if letters
                if(isNaN(num)){
                    throw "Enter only numbers !!";
                }


                //print number
                document.getElementById('numResult').textContent = `Number is  : ${num}`;
            }
            catch(error){
                document.getElementById('errorResult').textContent = error;
            }
            finally{
                console.log("Thank You👋");
            }
    </script>
</body>
</html>
